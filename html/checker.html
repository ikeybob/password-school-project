<!DOCTYPE html>
<html lang = "en">
    
    <head>
        <meta charset = "UTF-8">
        <link rel="stylesheet" href="/style2.css">
        <h1>
            The Password Strength Checker:
        </h1>
    </head>

    <body>
       
            <fieldset>
                <legend>Enter your password:</legend>
                <form id = "password_enter" method = "post">
                    <input id = "passwordStrengthCheck" type = "text" name = "password_strength" placeholder = "e.g. 1234567890" required/>
                </form>
                <br>
                <button class = "submit" type = "button" onclick = "passwordValid(document.getElementById('passwordStrengthCheck').value),passwordStrength(document.getElementById('passwordStrengthCheck').value)">Submit</button><br><br>
                
                <button class = "back" type = "button" onclick = "back()">Back</button>

            </fieldset>
        
        <script src = "../js/script.js"></script>
    </body>
</html>
