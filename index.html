<!DOCTYPE html>
<html lang = "en">
  <head>
    <link rel="stylesheet" href="./styles.css"> 
    <meta charset = "UTF-8">
    <title>
      Everything-Password 
    </title>
    <h1>
      Everything Password
    </h1>
  </head>
  <body>
    <form id ="Password-Select" method = "post">
      <fieldset>
        <legend>Select Option:</legend>
        <label for = "Checker-option">Check Password</label>
        <input id = "Checker-option" type = "radio" name = "password_option" value = "check"/>
        <br>
        <label for = "Generate-option">Generate Password</label>
        <input id = "Generate-option" type = "radio" name = "password_option" value = "generate"/>
        <br>
        <label for = "Quit-option">Quit</label>
        <input id = "Quit-option" type = "radio" name = "password_option" value = "quit"/>
        <br>
        <button type = "button" onclick = "redirect()">Go</button>
      </fieldset>
      <script src = "js/script.js"></script>
    </form>
  </body>
</html>
